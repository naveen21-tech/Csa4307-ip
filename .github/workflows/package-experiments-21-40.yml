name: Package Experiments 21-40 as ZIP

on:
  push:
    branches: [main]
    paths:
      - 'lab programs/Experiments21-40/**'
      - '.github/workflows/package-experiments-21-40.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create ZIP archive
        run: |
          cd "lab programs"
          rm -f "Experiment-21 to 40.zip"
          zip -r "Experiment-21 to 40.zip" "Experiments21-40"
          cd ..
      - name: Commit ZIP archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "lab programs/Experiment-21 to 40.zip"
          if ! git diff --cached --quiet; then
            git commit -m "Package Experiments 21-40 as ZIP"
            git push
          fi
